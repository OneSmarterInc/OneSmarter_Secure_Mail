[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onesmarter-secure-mail"
version = "0.1.0"
requires-python = ">=3.12"
description = "OneSmarter Secure Mail routing and portal prototype"

[tool.setuptools.packages.find]
include = ["secure_mail*", "backend*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["web", "backend/apps/core/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
