# Private Unix socket only. Socket access is restricted by volume mounts.
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 666
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
SelfCheck 600
StreamMaxLength 26M
MaxFileSize 26M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 15000
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 20
CommandReadTimeout 10
MaxThreads 4
MaxQueue 16
