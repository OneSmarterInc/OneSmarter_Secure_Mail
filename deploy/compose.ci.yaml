# Disposable CI only: no SMTP, real PostgreSQL/Celery/nginx, synthetic scanner/crypto.
x-app: &app
  image: onesmarter-ci-backend
  build: ..
  environment: &env
    CI: 'true'
    APP_ENV: test
    DJANGO_READ_DOT_ENV: 'false'
    POSTGRES_HOST: db
    POSTGRES_DB: secure_mail
    POSTGRES_USER: secure_mail
    POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?}
    REDIS_URL: redis://redis:6379/0
    TRUSTED_PROXY_IPS: '127.0.0.1'
    PUBLIC_URL: http://127.0.0.1:8080
    CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8080
    MAIL_PROVIDER: development
    SCAN_PROVIDER: synthetic
    KEY_PROTECTOR: local-development
    ENABLE_DEV_TOOLS: 'true'
    SETUP_TOKEN_SHA256: ${SETUP_TOKEN_SHA256:?}
    DEV_INBOX_TOKEN_SHA256: ${DEV_INBOX_TOKEN_SHA256:?}
    KEY_STATUS_URL: ''
    KEY_SERVICE_URL: ''
  volumes: [runtime:/app/.runtime]
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_mail
      POSTGRES_USER: secure_mail
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?}
    healthcheck:
      test: [CMD, pg_isready, -U, secure_mail]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
  init:
    <<: *app
    command: [sh, -c, 'python scripts/init_local.py && python manage.py migrate --noinput']
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    image: onesmarter-ci-frontend
    build: ../frontend
    network_mode: service:api
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 3s
      timeout: 5s
      retries: 30
  worker:
    <<: *app
    command: [celery, -A, backend.config.celery, worker, --loglevel=WARNING, --concurrency=2]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *app
    command: [celery, -A, backend.config.celery, beat, --loglevel=WARNING, --schedule=/app/.runtime/celerybeat]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  runtime:
