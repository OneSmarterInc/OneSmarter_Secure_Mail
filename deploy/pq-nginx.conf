# Candidate HTTPS edge: nginx/OpenSSL >=3.5 with X25519MLKEM768.
# Replace both example hostnames (including SNI guards) before deployment.
# portal.crt must cover both names, or configure separate certificates per host.
# Use this as the only public listener; the backend stays on its private Unix socket.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name staff.example.test;
    if ($ssl_server_name != "staff.example.test") { return 421; }
    ssl_certificate /run/pki/portal.crt;
    ssl_certificate_key /run/pki/portal.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_session_tickets off;
    ssl_session_cache off;
    ssl_early_data off;
    # No user-supplied header can establish this transport assertion.
    if ($ssl_curve != "X25519MLKEM768") { return 403; }
    root /usr/share/nginx/html;
    client_max_body_size 27m;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/dev/inbox { return 404; }
    location = /api/auth/setup { return 404; }
    location = /recipient-api { return 404; }
    location ^~ /recipient-api/ { return 404; }
    location = /recipient { return 404; }
    location ^~ /recipient/ { return 404; }
    location = /api/recipient { return 404; }
    location ^~ /api/recipient/ { return 404; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://unix:/run/onesmarter/app.sock:;
        proxy_set_header Host $http_host;
        # Overwrite, never append or relay client-supplied IP assertions.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_max_temp_file_size 0;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}

