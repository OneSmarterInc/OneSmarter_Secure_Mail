# Use instead of the TCP scanner configuration when the PQ gateway is deployed.
Foreground yes
User clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
LogClean no
SelfCheck 600
StreamMaxLength 26M
MaxFileSize 26M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 15000
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 20
CommandReadTimeout 10
MaxThreads 4
MaxQueue 16
LogTime yes
