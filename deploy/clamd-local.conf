# Use instead of the TCP scanner configuration when the PQ gateway is deployed.
Foreground yes
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 1000
ReadTimeout 30
CommandReadTimeout 30
LogTime yes
