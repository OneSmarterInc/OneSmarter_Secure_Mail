name: onesmarter-secure-mail

x-app: &app
  build: .
  environment: &environment
    APP_ENV: development
    DOCUMENT_INTEGRITY_KEY: ${DOCUMENT_INTEGRITY_KEY:?Run python scripts/init_compose.py first}
    POSTGRES_HOST: db
    POSTGRES_DB: secure_mail
    POSTGRES_USER: secure_mail
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_compose.py first}
    REDIS_URL: redis://redis:6379/0
    TRUSTED_PROXY_IPS: "127.0.0.1"
    PUBLIC_URL: http://localhost:8080
    CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    KEY_PROTECTOR: local-development
    KEY_STATUS_URL: ""
    MAIL_PROVIDER: development
    SCAN_PROVIDER: clamav
    CLAMAV_TRANSPORT: unix
    CLAMAV_SOCKET: /run/clamav/clamd.sock
    CLAMAV_MAX_SIGNATURE_AGE_HOURS: "48"
  group_add: ["${CLAMAV_GID:?Set CLAMAV_GID to the clamav group ID in the pinned scanner image}"]
  volumes:
    - runtime:/app/.runtime
    - clamav_socket:/run/clamav:ro
  restart: unless-stopped

services:
  clamav:
    image: clamav/clamav:1.4@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    healthcheck:
      test: [CMD, clamdscan, --config-file=/etc/clamav/clamd.conf, --ping=1:1]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    environment:
      TZ: UTC
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav_signatures:/var/lib/clamav
      - clamav_socket:/tmp
      - ./deploy/clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: secure_mail
      POSTGRES_USER: secure_mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_compose.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U secure_mail -d secure_mail']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  init:
    <<: *app
    command: [python, scripts/container_init.py]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    environment:
      <<: *environment
      SETUP_TOKEN_SHA256: ${SETUP_TOKEN_SHA256:?Run python scripts/init_compose.py first}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    # Loopback proxy keeps the synthetic mailbox and setup inaccessible off-host.
    network_mode: service:api
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  worker:
    <<: *app
    command: [celery, -A, backend.config.celery, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    <<: *app
    command: [celery, -A, backend.config.celery, beat, --loglevel=INFO, --schedule=/app/.runtime/celerybeat]
    depends_on:
      init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  clamav_socket:
  clamav_signatures:
  database:
  runtime:
  redis:
