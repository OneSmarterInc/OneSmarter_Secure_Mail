name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pq-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      RUN_PQ_TRANSPORT: "1"
      RUN_KEY_SERVICE_LOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build verified PQ runtime (Python and OpenSSL together)
        run: docker build -f deploy/Dockerfile.pq -t securemail-pq-test .
      - name: Test actual hybrid TLS and key-service load
        run: |
          docker run --rm --user root -v "$PWD:/app" -e APP_ENV -e RUN_PQ_TRANSPORT -e RUN_KEY_SERVICE_LOAD securemail-pq-test sh -ec '
            pip install -r requirements-test.lock
            python scripts/init_local.py
            python scripts/check_pq_transport.py
            pytest backend/tests/test_keyservice.py backend/tests/test_pq_transport.py -q
            cat .runtime/key-service-load.json
          '
  proxy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REQUIRE_NGINX_TEST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: pip install -r requirements.lock
      - run: python scripts/init_local.py
      - run: pytest backend/tests/test_rate_limits.py backend/tests/test_proxy_integration.py backend/tests/test_pq_ingress.py -q
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: secure_mail
          POSTGRES_USER: secure_mail
          # Ephemeral isolated CI database only; no external credentials.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U secure_mail" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: secure_mail
      POSTGRES_USER: secure_mail
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: requirements.lock,
          }
      - run: pip install -r requirements.lock -r requirements-test.lock
      - run: python scripts/init_local.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24" }
      - run: pip install -r requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/check_compose_browser.py
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      RUN_CLAMAV_INTEGRATION: "1"
      SCAN_PROVIDER: clamav
      CLAMAV_TRANSPORT: unix
      CLAMAV_SOCKET: /tmp/onesmarter-scanner/clamd.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock
      - run: python scripts/init_local.py
      - name: Start isolated scanner with configured limits
        run: |
          mkdir -p /tmp/onesmarter-scanner
          chmod 1777 /tmp/onesmarter-scanner
          docker run --detach --health-cmd "clamdscan --config-file=/etc/clamav/clamd.conf --ping=1:1" --health-interval 5s --health-start-period 60s --name readiness-clamav --volume /tmp/onesmarter-scanner:/tmp --env TZ=UTC --volume "$PWD/deploy/clamd.conf:/etc/clamav/clamd.conf:ro" clamav/clamav:1.4@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
      - name: Wait for signatures and daemon
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' readiness-clamav)" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: sudo chgrp "$(id -g)" "$CLAMAV_SOCKET"
      - name: Verify loaded signatures through the application socket
        run: |
          docker exec readiness-clamav clamdscan --config-file=/etc/clamav/clamd.conf --reload
          for attempt in $(seq 1 30); do
            if python manage.py check_scanner; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pytest backend/tests/test_readiness.py::test_real_clamav_clean_and_eicar backend/tests/test_scanner.py -q
      - name: Scanner diagnostics
        if: failure()
        run: docker logs readiness-clamav && docker inspect --format '{{json .State.Health}}' readiness-clamav
      - name: Stop disposable scanner
        if: always()
        run: docker rm --force readiness-clamav

  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --strict -r requirements.lock -r requirements-test.lock

  security-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - run: pip install bandit==1.9.4
      - run: bandit -r backend/apps backend/keyservice backend/transport -lll -f json -o bandit.json
      - name: Reject incomplete static analysis
        run: python -c "import json; report=json.load(open('bandit.json')); assert not report['errors'], 'Bandit did not scan all files'"
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact --exit-code 1
      - run: docker build -t securemail-backend:scan .
      - run: docker build -t securemail-frontend:scan frontend
      - run: docker build -f deploy/Dockerfile.pq -t securemail-pq:scan .
      - name: Reject high and critical container vulnerabilities
        run: |
          for image in securemail-backend:scan securemail-frontend:scan securemail-pq:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done
