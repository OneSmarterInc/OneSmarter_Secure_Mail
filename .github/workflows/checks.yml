name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pq-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      RUN_PQ_TRANSPORT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.15" }
      - run: pip install -r requirements.lock -r requirements-test.lock
      - run: python scripts/init_local.py
      - run: python scripts/check_pq_transport.py
      - run: pytest backend/tests/test_keyservice.py backend/tests/test_pq_transport.py -q
  proxy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REQUIRE_NGINX_TEST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: pip install -r requirements.lock
      - run: python scripts/init_local.py
      - run: pytest backend/tests/test_rate_limits.py backend/tests/test_proxy_integration.py backend/tests/test_pq_ingress.py -q
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secure_mail
          POSTGRES_USER: secure_mail
          # Ephemeral isolated CI database only; no external credentials.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U secure_mail" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: secure_mail
      POSTGRES_USER: secure_mail
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: requirements.lock,
          }
      - run: pip install -r requirements.lock -r requirements-test.lock
      - run: python scripts/init_local.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24" }
      - run: pip install -r requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/check_compose_browser.py
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      RUN_CLAMAV_INTEGRATION: "1"
      CLAMAV_TRANSPORT: unix
      CLAMAV_SOCKET: /tmp/onesmarter-scanner/clamd.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock
      - run: python scripts/init_local.py
      - name: Start isolated scanner with configured limits
        run: |
          mkdir -p /tmp/onesmarter-scanner
          docker run --detach --name readiness-clamav --volume /tmp/onesmarter-scanner:/tmp --env TZ=UTC --volume "$PWD/deploy/clamd.conf:/etc/clamav/clamd.conf:ro" clamav/clamav:1.4
      - name: Wait for signatures and daemon
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' readiness-clamav)" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: python manage.py check_scanner
      - run: pytest backend/tests/test_readiness.py::test_real_clamav_clean_and_eicar backend/tests/test_scanner.py -q
      - name: Stop disposable scanner
        if: always()
        run: docker rm --force readiness-clamav

  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --strict -r requirements.lock -r requirements-test.lock
